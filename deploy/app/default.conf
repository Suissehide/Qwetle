server {
    listen       80;
    server_name  localhost;

    # Traefik termine le TLS : sans ceci, nginx redirige /about vers http://qwetle.fr/about/
    absolute_redirect off;

    # Un seul domaine pour Google : www.qwetle.fr renvoie vers qwetle.fr
    if ($host = www.qwetle.fr) {
        return 301 https://qwetle.fr$request_uri;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
